name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # プラグインは node_modules 無しで配布されるので、npm install 前に動くことを確かめる
      - name: Plugin scripts run without node_modules
        run: |
          node plugins/persona-feedback/scripts/list-personas.mjs --json > /dev/null
          node plugins/persona-feedback/skills/persona-tester/scripts/behavior-rules.mjs \
            render plugins/persona-feedback/personas/yamada-50s-dsl.yaml > /dev/null

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Validate persona/feedback schemas
        run: npm run validate

      - name: Aggregate sample run (smoke - score_gap path)
        run: |
          node plugins/persona-feedback/skills/persona-tester/scripts/aggregate.mjs \
            --feedbacks examples/runs/sample-run/raw \
            --output /tmp/smoke-report.md \
            --format both
          test -s /tmp/smoke-report.md
          test -s /tmp/smoke-report.json
          grep -q "overall スコア差" /tmp/smoke-report.md

      - name: Aggregate sample run (smoke - recommend_split path)
        run: |
          node plugins/persona-feedback/skills/persona-tester/scripts/aggregate.mjs \
            --feedbacks examples/runs/sample-run-recommend-split/raw \
            --output /tmp/smoke-split.md \
            --format markdown
          grep -q "would_recommend がペルソナ間で割れた" /tmp/smoke-split.md

      - name: Aggregate sample run (smoke - category-only all-agreement)
        run: |
          node plugins/persona-feedback/skills/persona-tester/scripts/aggregate.mjs \
            --feedbacks examples/runs/sample-run-location-varied/raw \
            --output /tmp/smoke-loc.md \
            --format markdown
          grep -q "location 表現がペルソナ間で揺れている" /tmp/smoke-loc.md

      # 要素の呼び方も severity も違う同じ画面の指摘が全員指摘にまとまり、
      # 1体だけの low の指摘も既定しきい値 (low) で残ることを確かめる
      - name: Aggregate sample run (smoke - page-match all-agreement / low threshold)
        run: |
          node plugins/persona-feedback/skills/persona-tester/scripts/aggregate.mjs \
            --feedbacks examples/runs/sample-run-page-match/raw \
            --output /tmp/smoke-page.md \
            --format markdown
          grep -q "要素の呼び方がペルソナ間で揺れている" /tmp/smoke-page.md
          grep -q "税込か税抜かの表記が無く" /tmp/smoke-page.md
          node plugins/persona-feedback/skills/persona-tester/scripts/aggregate.mjs \
            --feedbacks examples/runs/sample-run-page-match/raw \
            --output /tmp/smoke-page-medium.md \
            --format markdown \
            --severity-threshold medium
          ! grep -q "税込か税抜かの表記が無く" /tmp/smoke-page-medium.md

      - name: Aggregate single persona (smoke - findings are not dropped)
        run: |
          node plugins/persona-feedback/skills/persona-tester/scripts/aggregate.mjs \
            --feedbacks examples/runs/sample-run-page-match/raw/rookie.json \
            --output /tmp/smoke-single.md \
            --format markdown
          grep -q "税込か税抜かの表記が無く" /tmp/smoke-single.md

      # 迷った自己申告の回数で赤フラグが立ち、実測の秒数は参考値として並ぶことを確かめる
      - name: Aggregate sample run (smoke - behavior metrics)
        run: |
          node plugins/persona-feedback/skills/persona-tester/scripts/aggregate.mjs \
            --feedbacks examples/runs/sample-run-behavior-metrics/raw \
            --output /tmp/smoke-behavior.md \
            --format markdown
          grep -q "hesitated_count=3" /tmp/smoke-behavior.md
          grep -q "モデルの思考時間" /tmp/smoke-behavior.md

      - name: Validate plugin manifests (JSON syntax)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/persona-feedback/.claude-plugin/plugin.json','utf8'))"
